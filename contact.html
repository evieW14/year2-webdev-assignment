<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Evie's Music Room</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Sign up for Beyoncé updates in Evie's Music Room. Join our mailing list for news and music content.">

        <!-- Base styles -->
        <link rel="stylesheet" href="styles/base_style.css">

        <!-- Contact page specific styles -->
        <link rel="stylesheet" href="styles/contact.css">

        <!-- General and Contact specific Javascript -->
        <script src="scripts/general.js" defer></script>
        <script src="scripts/contact.js" defer></script>
    </head>

    <body>
        <header class="container">
            <h1>Beyoncé</h1>
            <nav id="nav" aria-label="Main Navigation"></nav>
        </header>


        <main class="container">
            <!-- Contact Mailing Form -->
            <form class="mailing-form" action="#" onsubmit="return validateForm()" aria-label="Contact Form">
                <h2> Sign Up to our mailing list!</h2>

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>

                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Email" required aria-describedby="emailError">
                <span id="emailError" class="error" aria-live="polite"></span>

                <input type="submit" value="Sign up">
            </form>
        </main>

        <footer class="container">
            <div id="copyright">
                <p>&copy; 2025 My Assignment Website</p>
            </div>
        </footer>
    </body>
</html>
