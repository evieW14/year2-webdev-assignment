<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Evie's Music Room</title>
        <meta charset="UTF-8">

        <!-- Base styles -->
        <link rel="stylesheet" href="styles/base_style.css">

        <!-- Contact page specific styles -->
        <link rel="stylesheet" href="styles/contact.css">

        <!-- General and Contact specific Javascript -->
        <script src="scripts/general.js" defer></script>
        <script src="scripts/contact.js" defer></script>
    </head>

    <body>
        <header class="container">
            <h1>Beyoncé</h1>
            <nav id="nav"></nav>        
        </header>


        <main class="container">
            <!-- Contact Mailing Form -->
            <form class="mailing-form" action="#" onsubmit="return validateForm()">
                <h2> Sign Up to our mailing list!</h2>
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Full Name" required size="36">

                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Email" required size="36">
                <span id="emailError" class="error"></span>

                <input type="submit" value="Sign up">
            </form>
        </main>

        <footer class="container">
            <div id="copyright">
                <p>&copy; 2025 My Assignment Website</p>
            </div>
        </footer>
    </body>
</html>
