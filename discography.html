<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Evie's Music Room</title>
        <meta charset="UTF-8">

        <!-- Base styles -->
        <link rel="stylesheet" href="styles/base_style.css">

        <!-- Discography page specific styles -->
        <link rel="stylesheet" href="styles/discography.css">

        <!-- General and specific Discography scripts -->
        <script src="scripts/general.js" defer></script>
        <script src="scripts/discography.js" defer></script>
        <script src="scripts/data/destinys_child.js"></script>
        <script src="scripts/data/beyonce.js"></script>
    </head>

    <body>
        <header class="container">
            <h1>Beyoncé</h1>
            <nav id="nav"></nav>
        </header>

        <main class="container">
            <!-- Artist Selection -->
            <div class="tabs">
                <button class="tab-btn active" data-artist="destinys-child">Destiny's Child</button>
                <button class="tab-btn" data-artist="beyonce">Beyoncé</button>
            </div>

            <!-- Category Dropdown for Album/Singles/Tours -->
            <div class="category-controls">
                <div class="dropdown-wrapper">
                    <select id="category-select">
                        <option value="albums">Albums</option>
                        <option value="singles">Singles</option>
                        <option value="tours">Tours</option>
                    </select>
                </div>
            </div>

            <div class="content" id="content"></div>

            <!-- Track List Modal for Albums-->
            <div class="modal-overlay hidden" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <div id="${modalId}" class="modal">
                    <div class="modal-header">
                        <div class="modal-header-info">
                            <p class="modal-label">Tracklist</p>
                            <h2 class="modal-title" id="modal-title"></h2>
                        </div>
                        <button class="modal-close" aria-label="Close">&times;</button>
                    </div>
                    <ol class="modal-track-list" id="modal-tracks"></ol>
                </div>
            </div>
        </main>

        <footer class="container">
            <div id="copyright">
                <p>&copy; 2025 My Assignment Website</p>
            </div>
        </footer>
    </body>
</html>
