<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Evie's Music Room</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Explore Hall of Fame entries by year">

        <!-- Base styles -->
        <link rel="stylesheet" href="styles/base_style.css">

        <!-- Hall of Fame page specific styles -->
        <link rel="stylesheet" href="styles/hall_of_fame.css">

        <!-- General and HOF Specific Javascript files -->
        <script src="scripts/general.js" defer></script>
        <script src="scripts/hall_of_fame.js" defer></script>
    </head>

    <body>
        <header class="container">
            <h1>Beyoncé</h1>
            <nav id="nav" aria-label="Main Navigation"></nav>
        </header>

        <main class="container">
            <!-- Hall Of Fame Year Form -->
            <form class="hof-form" action="#" onsubmit="return validateHofForm()">
                <label for="year">Enter a Year</label>
                <input type="text" id="year" size="4">
                <span id="yearError" class="error"></span>
                <input type="submit" value="Go!">
            </form>

            <!-- Error Message -->
            <div id="hofError" class="error" aria-live="polite"></div>

            <!-- Hall Of Fame Results -->
            <div id="hofHeader"></div>
            <div id="hofResults"></div>
        </main>

        <footer class="container">
            <div id="copyright">
                <p>&copy; 2025 My Assignment Website</p>
            </div>
        </footer>
    </body>
</html>
